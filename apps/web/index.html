<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whale Editor · DeepSeek 驱动的文档自动编辑</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><g fill='%231e5e8e' opacity='0.55'><circle cx='13' cy='4' r='0.85'/><circle cx='15.5' cy='2' r='0.65'/><circle cx='17.5' cy='4.5' r='0.75'/></g><path fill='%231e5e8e' d='M6.5 13 L2 9 L4.5 13 L2 17 Z'/><path fill='%231e5e8e' d='M6.5 13 C6.5 9 11 7.2 16 8 C20 8.5 22 10.8 22 13 C22 16.2 19 18 14 18.7 C9 19.3 6.5 17 6.5 13 Z'/><circle cx='18.2' cy='12' r='1' fill='%23ffffff'/></svg>">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <!-- Reusable whale glyph. Custom design: spouting + V-flukes silhouette,
       facing right. Shares the 'friendly cartoon whale' genre with similar
       brands but distinguished by the 3-droplet spout and angled tail flukes.
       Color via currentColor → adapts to light/dark theme automatically. -->
  <svg width="0" height="0" style="position:absolute;width:0;height:0" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="whale-glyph" viewBox="0 0 24 24">
        <!-- Spout: 3 ascending water droplets -->
        <g fill="currentColor" opacity="0.55">
          <circle cx="13" cy="4" r="0.85"/>
          <circle cx="15.5" cy="2" r="0.65"/>
          <circle cx="17.5" cy="4.5" r="0.75"/>
        </g>
        <!-- Tail flukes (V-shape) -->
        <path fill="currentColor" d="M6.5 13 L2 9 L4.5 13 L2 17 Z"/>
        <!-- Body -->
        <path fill="currentColor" d="M6.5 13 C6.5 9 11 7.2 16 8 C20 8.5 22 10.8 22 13 C22 16.2 19 18 14 18.7 C9 19.3 6.5 17 6.5 13 Z"/>
        <!-- Eye -->
        <circle cx="18.2" cy="12" r="1" fill="var(--surface)"/>
      </symbol>
    </defs>
  </svg>

  <header class="topbar">
    <div class="brand" aria-label="Whale Editor">
      <svg class="logo" aria-hidden="true" focusable="false"><use href="#whale-glyph"/></svg>
      <span class="name">Whale Editor</span>
      <span class="subtitle">DeepSeek 驱动 · 缓存命中优化</span>
    </div>
    <div class="topbar-right">
      <span class="server-pill">本地工作台</span>
      <button type="button" id="key-toggle" class="key-toggle" aria-expanded="false">
        <span class="key-icon" aria-hidden="true"></span>
        <span class="key-label">API Key</span>
        <span class="key-state" id="key-state">未设置</span>
      </button>
    </div>
  </header>

  <section class="key-panel" id="key-panel" hidden>
    <div class="key-panel-inner">
      <label for="key-input" class="key-help">
        DeepSeek API Key（仅本浏览器保存，不会上传服务器明文记录）
      </label>
      <div class="key-row">
        <input type="password" id="key-input" placeholder="sk-..." autocomplete="off" spellcheck="false">
        <button type="button" id="key-save" class="btn-primary">保存</button>
        <button type="button" id="key-clear" class="btn-secondary">清除</button>
      </div>
      <label class="key-remember">
        <input type="checkbox" id="key-remember" checked>
        <span>在本浏览器记住</span>
        <span class="key-hint">未勾选则仅本次会话有效；留空则使用服务器默认 key</span>
      </label>
    </div>
  </section>

  <main class="workspace">
    <section class="editor-pane" aria-label="文档编辑器">
      <div class="editor-toolbar">
        <div class="toolbar-group">
          <button type="button" id="tool-edit" class="tool-button active" data-editor-mode="edit" aria-pressed="true" aria-controls="document-page">编辑</button>
          <button type="button" id="tool-comments" class="tool-button" data-editor-mode="comments" aria-pressed="false" aria-controls="document-page">批注</button>
          <button type="button" id="tool-review" class="tool-button" data-editor-mode="review" aria-pressed="false" aria-controls="document-page">审阅</button>
        </div>
        <div class="toolbar-group align-right">
          <span class="doc-state" id="doc-state">等待文档</span>
          <button type="button" class="compact-upload" id="compact-upload">上传</button>
        </div>
      </div>

      <div class="editor-stage" id="editor-stage">
        <div class="empty-drop" id="empty-drop">
          <svg class="empty-drop-icon" aria-hidden="true" focusable="false"><use href="#whale-glyph"/></svg>
          <div class="empty-drop-title">把文档拖到这里</div>
          <div class="empty-drop-hint">支持 .docx / .pptx / .doc / .ppt</div>
        </div>
        <article class="document-page" id="document-page" contenteditable="true" spellcheck="false" hidden></article>
      </div>

    </section>

    <aside class="ai-panel" aria-label="AI 对话框">
      <div class="ai-header">
        <div>
          <div class="ai-title">
            <svg class="ai-logo" aria-hidden="true" focusable="false"><use href="#whale-glyph"/></svg>
            Whale Editor
          </div>
          <div class="ai-subtitle">文档编辑助手</div>
        </div>
        <div class="ai-live-pill" id="ai-live-pill">空闲</div>
      </div>

      <div class="chat-scroll" id="chat-scroll" aria-live="polite">
        <div class="message assistant intro-message">
          <div class="message-label">Whale Editor</div>
          <div class="message-body">
            上传文档后，左侧会显示文稿预览。你可以直接输入要修改的内容，我会边执行边把可见变更同步到左侧。
          </div>
        </div>

        <section class="message assistant progress-card" id="progress-card" hidden>
          <div class="message-label">执行进程</div>
          <h2 class="progress-title">
            <span id="progress-status-icon" class="status-dot" aria-hidden="true"></span>
            <span id="progress-status-text">规划中</span>
          </h2>

          <div class="whale-stage idle" id="whale-stage">
            <div class="activity-orbit" aria-hidden="true">
              <span></span>
            </div>
            <div class="whale-caption" id="whale-caption">DeepSeek 正在处理</div>
          </div>

          <div class="rationale" id="rationale" hidden></div>

          <ol class="steps" id="steps"></ol>

          <div class="metrics" id="metrics" hidden>
            <div class="metric">
              <div class="metric-label">缓存命中率</div>
              <div class="metric-value" id="m-cache-ratio">—</div>
              <div class="metric-sub" id="m-cache-sub">—</div>
            </div>
            <div class="metric">
              <div class="metric-label">输入 token</div>
              <div class="metric-value" id="m-input">—</div>
            </div>
            <div class="metric">
              <div class="metric-label">输出 token</div>
              <div class="metric-value" id="m-output">—</div>
            </div>
            <div class="metric">
              <div class="metric-label">迭代次数</div>
              <div class="metric-value" id="m-iters">—</div>
            </div>
          </div>

          <div class="actions" id="final-actions" hidden>
            <button id="btn-download" class="btn-primary">下载修改后的文档</button>
            <button id="btn-reedit" class="btn-secondary" hidden>继续修改 <span id="reedit-status"></span></button>
            <button id="btn-restart" class="btn-secondary">重新开始</button>
          </div>

          <div class="error-box" id="error-box" hidden></div>
        </section>
      </div>

      <section class="input-card composer" id="input-card">
        <!-- File row: file chip when set, else just a "+" button -->
        <div class="composer-files">
          <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="点击或拖入文档" title="拖入或点击添加 DOCX / PPTX / DOC / PPT">
            <input type="file" id="file-input" accept=".docx,.pptx,.doc,.ppt" hidden>
            <span class="dropzone-empty" id="dropzone-empty" aria-hidden="true">
              <svg viewBox="0 0 16 16" class="plus-icon" aria-hidden="true" focusable="false">
                <path fill="currentColor" d="M7.25 2.5h1.5v4.75h4.75v1.5H8.75v4.75h-1.5V8.75H2.5v-1.5h4.75z"/>
              </svg>
            </span>
            <span class="dropzone-filled" id="dropzone-filled" hidden>
              <span class="file-chip-icon" aria-hidden="true">📄</span>
              <span class="file-chip-name" id="file-name"></span>
              <span class="file-chip-meta" id="file-meta"></span>
              <button type="button" class="file-chip-remove" id="file-clear" aria-label="移除文档">×</button>
            </span>
          </div>
        </div>

        <!-- Intent textarea (no border; sits inside composer card) -->
        <label class="composer-label sr-only" for="intent-input">指令</label>
        <textarea
          id="intent-input"
          rows="3"
          placeholder="例如：把所有 AutoPaper 改成 PaperAuto，页眉换成季度报告 2025Q4；或按参考材料里的格式说明重排。"
        ></textarea>

        <!-- References row: chips inline, "+" to add -->
        <div class="ref-row">
          <button type="button" class="ref-add-chip" id="ref-add" title="添加参考材料 (PDF / DOC / DOCX / PPT / PPTX / MD / TXT，最多 6 份)">
            <svg viewBox="0 0 16 16" class="plus-icon" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M7.25 2.5h1.5v4.75h4.75v1.5H8.75v4.75h-1.5V8.75H2.5v-1.5h4.75z"/>
            </svg>
            <span>参考材料</span>
          </button>
          <input type="file" id="ref-input" accept=".pdf,.doc,.docx,.ppt,.pptx,.md,.markdown,.txt" multiple hidden>
          <ul class="ref-list" id="ref-list"></ul>
        </div>

        <!-- Run button: full-width primary action -->
        <button id="btn-run" class="composer-run btn-primary" disabled>
          <span class="btn-label">发送并执行</span>
          <span class="btn-spinner" hidden>
            <svg viewBox="0 0 16 16" class="spin-icon" aria-hidden="true" focusable="false">
              <circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="9 9" opacity="0.85"/>
            </svg>
            处理中
          </span>
        </button>
      </section>
    </aside>
  </main>

  <script src="/app.js"></script>
</body>
</html>
